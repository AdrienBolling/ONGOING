readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.3",
    "scipy>=1.16.2",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10.6"]
dev = ["pytest>=8.0"]
